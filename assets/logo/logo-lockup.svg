<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="560" height="120" role="img" aria-label="TRAUM Planer">
  <title>TRAUM Planer</title>
  <defs>
    <linearGradient id="accent" x1="21" y1="21" x2="99" y2="99" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7E9CF7"/>
      <stop offset="1" stop-color="#5A76D6"/>
    </linearGradient>
    <style>
      .wordmark { fill: #14161C; }
      @media (prefers-color-scheme: dark) {
        .wordmark { fill: #ECEEF2; }
      }
    </style>
  </defs>

  <!-- Mark -->
  <rect x="0" y="0" width="120" height="120" rx="27" fill="#14161C"/>
  <rect x="21" y="21" width="78" height="78" rx="15" fill="url(#accent)"/>
  <path d="M38 62 L58 82 L86 40"
        fill="none" stroke="#ECEEF2" stroke-width="7.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="146" y="56" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="0.5" class="wordmark">TRAUM</text>
  <text x="146" y="92" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="34" font-weight="600" fill="#6C8EF5">Planer</text>
</svg>
