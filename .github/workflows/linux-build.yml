name: Linux build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libnotify-dev libayatana-appindicator3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - run: flutter pub get

      - name: Fetch bundled Whisper model
        run: bash tool/fetch_models.sh

      - run: flutter build linux --release

      - name: Package AppImage
        run: |
          set -e
          BUNDLE=build/linux/x64/release/bundle
          APPDIR=AppDir
          mkdir -p "$APPDIR"
          cp -r "$BUNDLE"/* "$APPDIR"/

          # `flutter build linux` only bundles the app's own code plus the
          # Flutter engine — a few plugins pull in system libraries at
          # runtime (notification, tray icon, the vendor-neutral GLESv2
          # dispatcher used for rendering) that this CI image has but an
          # arbitrary end user's Linux install may not, so bundle them
          # explicitly. Deliberately NOT bundling GTK/X11/pango/cairo/glib:
          # those are present on essentially any Linux desktop already, and
          # privately bundling a whole toolkit risks breaking icon theming
          # and GSettings schema lookups for no benefit here.
          for lib in \
            libnotify.so.4 \
            libayatana-appindicator3.so.1 \
            libayatana-indicator3.so.7 \
            libayatana-ido3-0.4.so.0 \
            libdbusmenu-glib.so.4 \
            libdbusmenu-gtk3.so.4 \
            libGLESv2.so.2 \
          ; do
            path=$(ldconfig -p | awk -v l="$lib" '$1 == l {print $NF; exit}')
            if [ -n "$path" ]; then
              cp -L "$path" "$APPDIR/lib/$lib"
            else
              echo "::warning::$lib not found on the build image; the AppImage may fail to start on some systems"
            fi
          done

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/lib:$LD_LIBRARY_PATH"
          exec "$HERE/traum_planer" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          cp assets/icon/app_icon.png "$APPDIR/traum-planer.png"

          cat > "$APPDIR/traum-planer.desktop" <<'EOF'
          [Desktop Entry]
          Name=TRAUM Planer
          Exec=traum_planer
          Icon=traum-planer
          Type=Application
          Categories=Office;
          EOF

          wget -q -O appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          ./squashfs-root/AppRun "$APPDIR" traum-planer-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: traum-planer-linux-appimage
          path: traum-planer-x86_64.AppImage
