<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>body{margin:0}</style>
</helmet>
<div style="width:1440px;height:900px;display:flex;flex-direction:column;background:#14161C;font-family:'Inter',sans-serif;color:#ECEEF2;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.45)">
  <div style="height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;border-bottom:1px solid #262A34">
    <div style="display:flex;align-items:center;gap:8px">
      <div style="width:8px;height:8px;border-radius:999px;background:#6C8EF5"></div>
      <div style="font-size:13px;font-weight:500;color:#A6ACBB">Wochenplan</div>
    </div>
    <div style="display:flex;gap:4px">
      <div style="width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 12 12"><line x1="1" y1="6" x2="11" y2="6" stroke="#A6ACBB" stroke-width="1.4"/></svg></div>
      <div style="width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="#A6ACBB" stroke-width="1.4"/></svg></div>
      <div style="width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 12 12"><line x1="1" y1="1" x2="11" y2="11" stroke="#A6ACBB" stroke-width="1.4"/><line x1="11" y1="1" x2="1" y2="11" stroke="#A6ACBB" stroke-width="1.4"/></svg></div>
    </div>
  </div>
  <div style="display:flex;flex:1;min-height:0">
    <div style="width:224px;flex-shrink:0;background:#1B1E26;border-right:1px solid #262A34;padding:20px 16px;display:flex;flex-direction:column;gap:4px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:24px;padding:0 4px">
        <div style="width:28px;height:28px;border-radius:8px;background:#6C8EF5;display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 14 14"><rect x="1" y="1" width="12" height="3" rx="1" fill="#fff"/><rect x="1" y="6" width="12" height="3" rx="1" fill="#fff" opacity="0.7"/><rect x="1" y="10" width="7" height="3" rx="1" fill="#fff" opacity="0.4"/></svg></div>
        <div style="font-size:15px;font-weight:600">Wochenplan</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;height:40px;padding-left:7px;border-left:3px solid transparent;border-radius:8px">
        <svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="#A6ACBB" stroke-width="1.5"/><path d="M8 5v3l2 1.5" stroke="#A6ACBB" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
        <div style="font-size:13px;color:#A6ACBB">Heute</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;height:40px;padding-left:7px;border-left:3px solid transparent;border-radius:8px">
        <svg width="16" height="16" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="#A6ACBB" stroke-width="1.5"/><line x1="1.5" y1="6" x2="14.5" y2="6" stroke="#A6ACBB" stroke-width="1.5"/></svg>
        <div style="font-size:13px;color:#A6ACBB">Woche</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;height:40px;padding-left:7px;border-left:3px solid #6C8EF5;background:#2A2E3A;border-radius:8px">
        <svg width="16" height="16" viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="13" height="13" rx="1.5" fill="none" stroke="#ECEEF2" stroke-width="1.5"/><line x1="1.5" y1="6" x2="14.5" y2="6" stroke="#ECEEF2" stroke-width="1.5"/><line x1="6" y1="6" x2="6" y2="14.5" stroke="#ECEEF2" stroke-width="1.5"/><line x1="10" y1="6" x2="10" y2="14.5" stroke="#ECEEF2" stroke-width="1.5"/></svg>
        <div style="font-size:13px;font-weight:600;color:#ECEEF2">Monat</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;height:40px;padding-left:7px;border-left:3px solid transparent;border-radius:8px">
        <svg width="16" height="16" viewBox="0 0 16 16"><line x1="2" y1="14" x2="2" y2="8" stroke="#A6ACBB" stroke-width="1.5"/><line x1="8" y1="14" x2="8" y2="4" stroke="#A6ACBB" stroke-width="1.5"/><line x1="14" y1="14" x2="14" y2="10" stroke="#A6ACBB" stroke-width="1.5"/></svg>
        <div style="font-size:13px;color:#A6ACBB">Verlauf</div>
      </div>
      <div style="height:1px;background:#262A34;margin:12px 4px"></div>
      <div style="display:flex;align-items:center;gap:10px;height:40px;padding-left:7px;border-left:3px solid transparent;border-radius:8px">
        <svg width="16" height="16" viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="13" height="13" rx="3" fill="none" stroke="#A6ACBB" stroke-width="1.5"/></svg>
        <div style="font-size:13px;color:#A6ACBB">Pläne</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;height:40px;padding-left:7px;border-left:3px solid transparent;border-radius:8px">
        <svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.5" fill="none" stroke="#A6ACBB" stroke-width="1.5"/><circle cx="8" cy="8" r="6" fill="none" stroke="#A6ACBB" stroke-width="1.5" stroke-dasharray="1.5 2.2"/></svg>
        <div style="font-size:13px;color:#A6ACBB">Einstellungen</div>
      </div>
    </div>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;padding:24px 32px 24px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-shrink:0">
        <div style="font-size:22px;font-weight:600">August 2026</div>
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:28px;height:28px;border-radius:8px;border:1px solid #333947;display:flex;align-items:center;justify-content:center"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M6.5 1.5L2.5 5l4 3.5" stroke="#A6ACBB" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></div>
          <div style="width:28px;height:28px;border-radius:8px;border:1px solid #333947;display:flex;align-items:center;justify-content:center"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M3.5 1.5L7.5 5l-4 3.5" stroke="#A6ACBB" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px;flex-shrink:0">
        <sc-for list="{{ weekdayNames }}" as="w" hint-placeholder-count="7">
          <div style="text-align:center;font-size:11px;color:#6B7180;text-transform:uppercase;letter-spacing:0.04em;padding-bottom:4px">{{ w }}</div>
        </sc-for>
      </div>
      <div style="flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:6px;min-height:0">
        <sc-for list="{{ cells }}" as="c" hint-placeholder-count="35">
          <sc-if value="{{ c.num }}" hint-placeholder-val="{{ true }}">
            <div style="border-radius:10px;background:{{ c.bg }};border:{{ c.border }};padding:8px;display:flex;flex-direction:column;justify-content:space-between">
              <div style="font-size:13px;font-weight:500;color:{{ c.numColor }}">{{ c.num }}</div>
              <sc-if value="{{ c.hasBar }}" hint-placeholder-val="{{ false }}">
                <div style="display:flex;height:4px;border-radius:999px;overflow:hidden;background:#262A34">
                  <sc-for list="{{ c.segs }}" as="s" hint-placeholder-count="1">
                    <div style="width:{{ s.w }};background:{{ s.c }}"></div>
                  </sc-for>
                </div>
              </sc-if>
            </div>
          </sc-if>
        </sc-for>
      </div>
      <div style="display:flex;gap:20px;margin-top:16px;flex-shrink:0;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#A6ACBB"><div style="width:10px;height:10px;border-radius:3px;background:#57C97F"></div>Erledigt</div>
        <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#A6ACBB"><div style="width:10px;height:10px;border-radius:3px;background:#EAAE49"></div>Verspätet nachgeholt</div>
        <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#A6ACBB"><div style="width:10px;height:10px;border-radius:3px;border:1px solid #333947;background:#1B1E26"></div>Offen / bevorstehend</div>
        <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#A6ACBB"><div style="width:10px;height:10px;border-radius:3px;background:#14161C;border:1px solid #262A34"></div>Vergangen ohne Eintrag</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const weekdayNames = ['Mo','Di','Mi','Do','Fr','Sa','So'];
    const year = 2026, month = 7; // August
    const firstDow = (new Date(year, month, 1).getDay() + 6) % 7; // Mon=0
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = 17;
    const missedDays = [3, 10];
    const cells = [];
    for (let i = 0; i < firstDow; i++) cells.push({ num: null });
    for (let d = 1; d <= daysInMonth; d++) {
      const cell = { num: d };
      if (d > today) {
        cell.bg = '#1B1E26'; cell.border = '1px solid #262A34'; cell.numColor = '#6B7180'; cell.hasBar = false;
      } else if (d === today) {
        cell.bg = '#1B1E26'; cell.border = '1.5px solid #6C8EF5'; cell.numColor = '#6C8EF5'; cell.hasBar = false;
      } else if (missedDays.includes(d)) {
        cell.bg = '#14161C'; cell.border = '1px solid #262A34'; cell.numColor = '#4A4F5C'; cell.hasBar = false;
      } else if (d % 5 === 0) {
        cell.bg = '#1B1E26'; cell.border = '1px solid #262A34'; cell.numColor = '#ECEEF2'; cell.hasBar = true;
        cell.segs = [{ w: '65%', c: '#57C97F' }, { w: '35%', c: '#EAAE49' }];
      } else {
        cell.bg = '#1B1E26'; cell.border = '1px solid #262A34'; cell.numColor = '#ECEEF2'; cell.hasBar = true;
        cell.segs = [{ w: '100%', c: '#57C97F' }];
      }
      cells.push(cell);
    }
    return { weekdayNames, cells };
  }
}
</script>
</body>
</html>
