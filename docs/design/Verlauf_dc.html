<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>body{margin:0}</style>
</helmet>
<div style="width:1440px;height:900px;display:flex;flex-direction:column;background:#14161C;font-family:'Inter',sans-serif;color:#ECEEF2;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.45)">
  <div style="height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;border-bottom:1px solid #262A34">
    <div style="display:flex;align-items:center;gap:8px">
      <div style="width:8px;height:8px;border-radius:999px;background:#6C8EF5"></div>
      <div style="font-size:13px;font-weight:500;color:#A6ACBB">Wochenplan</div>
    </div>
    <div style="display:flex;gap:4px">
      <div style="width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 12 12"><line x1="1" y1="6" x2="11" y2="6" stroke="#A6ACBB" stroke-width="1.4"/></svg></div>
      <div style="width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="#A6ACBB" stroke-width="1.4"/></svg></div>
      <div style="width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 12 12"><line x1="1" y1="1" x2="11" y2="11" stroke="#A6ACBB" stroke-width="1.4"/><line x1="11" y1="1" x2="1" y2="11" stroke="#A6ACBB" stroke-width="1.4"/></svg></div>
    </div>
  </div>
  <div style="display:flex;flex:1;min-height:0">
    <div style="width:224px;flex-shrink:0;background:#1B1E26;border-right:1px solid #262A34;padding:20px 16px;display:flex;flex-direction:column;gap:4px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:24px;padding:0 4px">
        <div style="width:28px;height:28px;border-radius:8px;background:#6C8EF5;display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 14 14"><rect x="1" y="1" width="12" height="3" rx="1" fill="#fff"/><rect x="1" y="6" width="12" height="3" rx="1" fill="#fff" opacity="0.7"/><rect x="1" y="10" width="7" height="3" rx="1" fill="#fff" opacity="0.4"/></svg></div>
        <div style="font-size:15px;font-weight:600">Wochenplan</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;height:40px;padding-left:7px;border-left:3px solid transparent;border-radius:8px">
        <svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="#A6ACBB" stroke-width="1.5"/><path d="M8 5v3l2 1.5" stroke="#A6ACBB" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
        <div style="font-size:13px;color:#A6ACBB">Heute</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;height:40px;padding-left:7px;border-left:3px solid transparent;border-radius:8px">
        <svg width="16" height="16" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="#A6ACBB" stroke-width="1.5"/><line x1="1.5" y1="6" x2="14.5" y2="6" stroke="#A6ACBB" stroke-width="1.5"/></svg>
        <div style="font-size:13px;color:#A6ACBB">Woche</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;height:40px;padding-left:7px;border-left:3px solid transparent;border-radius:8px">
        <svg width="16" height="16" viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="13" height="13" rx="1.5" fill="none" stroke="#A6ACBB" stroke-width="1.5"/><line x1="1.5" y1="6" x2="14.5" y2="6" stroke="#A6ACBB" stroke-width="1.5"/><line x1="6" y1="6" x2="6" y2="14.5" stroke="#A6ACBB" stroke-width="1.5"/><line x1="10" y1="6" x2="10" y2="14.5" stroke="#A6ACBB" stroke-width="1.5"/></svg>
        <div style="font-size:13px;color:#A6ACBB">Monat</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;height:40px;padding-left:7px;border-left:3px solid #6C8EF5;background:#2A2E3A;border-radius:8px">
        <svg width="16" height="16" viewBox="0 0 16 16"><line x1="2" y1="14" x2="2" y2="8" stroke="#ECEEF2" stroke-width="1.5"/><line x1="8" y1="14" x2="8" y2="4" stroke="#ECEEF2" stroke-width="1.5"/><line x1="14" y1="14" x2="14" y2="10" stroke="#ECEEF2" stroke-width="1.5"/></svg>
        <div style="font-size:13px;font-weight:600;color:#ECEEF2">Verlauf</div>
      </div>
      <div style="height:1px;background:#262A34;margin:12px 4px"></div>
      <div style="display:flex;align-items:center;gap:10px;height:40px;padding-left:7px;border-left:3px solid transparent;border-radius:8px">
        <svg width="16" height="16" viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="13" height="13" rx="3" fill="none" stroke="#A6ACBB" stroke-width="1.5"/></svg>
        <div style="font-size:13px;color:#A6ACBB">Pläne</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;height:40px;padding-left:7px;border-left:3px solid transparent;border-radius:8px">
        <svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.5" fill="none" stroke="#A6ACBB" stroke-width="1.5"/><circle cx="8" cy="8" r="6" fill="none" stroke="#A6ACBB" stroke-width="1.5" stroke-dasharray="1.5 2.2"/></svg>
        <div style="font-size:13px;color:#A6ACBB">Einstellungen</div>
      </div>
    </div>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;padding:24px 32px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-shrink:0">
        <div style="font-size:22px;font-weight:600">Verlauf</div>
        <div style="display:flex;background:#1B1E26;border-radius:8px;padding:3px;gap:2px">
          <div style="padding:6px 14px;border-radius:6px;font-size:12.5px;color:#A6ACBB">Woche</div>
          <div style="padding:6px 14px;border-radius:6px;font-size:12.5px;background:#2A2E3A;color:#ECEEF2;font-weight:500">Monat</div>
          <div style="padding:6px 14px;border-radius:6px;font-size:12.5px;color:#A6ACBB">Jahr</div>
        </div>
      </div>
      <div style="flex:1;display:flex;gap:24px;min-height:0">
        <div style="width:40%;display:flex;flex-direction:column;gap:10px;overflow:auto">
          <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
            <div style="padding:14px 16px;border-radius:12px;background:#1B1E26;display:flex;flex-direction:column;gap:8px">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <div style="display:flex;align-items:center;gap:8px">
                  <div style="width:8px;height:8px;border-radius:999px;background:{{ it.color }}"></div>
                  <div style="font-size:14px">{{ it.title }}</div>
                </div>
                <div style="font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:500">{{ it.pct }}%</div>
              </div>
              <div style="height:5px;border-radius:999px;background:#262A34;overflow:hidden">
                <div style="height:100%;width:{{ it.pct }}%;background:{{ it.color }};border-radius:999px"></div>
              </div>
              <div style="align-self:flex-end;font-size:11px;color:#A6ACBB;padding:3px 10px;background:#232630;border-radius:999px">{{ it.streak }} Tage Streak</div>
            </div>
          </sc-for>
        </div>
        <div style="width:60%;display:flex;flex-direction:column;background:#1B1E26;border-radius:12px;padding:20px;min-height:0">
          <div style="font-size:13px;color:#A6ACBB;margin-bottom:16px">Erledigungsquote pro Woche</div>
          <div style="flex:1;display:flex;align-items:flex-end;gap:14px;min-height:0">
            <sc-for list="{{ weeks }}" as="w" hint-placeholder-count="8">
              <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end">
                <div style="width:100%;max-width:36px;display:flex;flex-direction:column-reverse;border-radius:6px;overflow:hidden;height:{{ w.totalH }}">
                  <div style="height:{{ w.onH }};background:#57C97F"></div>
                  <div style="height:{{ w.lateH }};background:#EAAE49"></div>
                </div>
                <div style="font-size:10.5px;color:#6B7180;font-family:'IBM Plex Mono',monospace">{{ w.label }}</div>
              </div>
            </sc-for>
          </div>
          <div style="display:flex;gap:20px;margin-top:16px;padding-top:16px;border-top:1px solid #262A34">
            <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#A6ACBB"><div style="width:10px;height:10px;border-radius:3px;background:#57C97F"></div>Pünktlich erledigt</div>
            <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#A6ACBB"><div style="width:10px;height:10px;border-radius:3px;background:#EAAE49"></div>Verspätet nachgeholt</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const items = [
      { title: 'Mittagessen vorbereiten', color: '#E8735A', pct: 92, streak: 14 },
      { title: 'Bett machen', color: '#F0C550', pct: 100, streak: 30 },
      { title: 'Meditation', color: '#8B7CF0', pct: 76, streak: 6 },
      { title: 'Müll rausbringen', color: '#4FB8D6', pct: 65, streak: 3 }
    ];
    const maxH = 180;
    const raw = [
      { on: 70, late: 15, label: 'KW25' }, { on: 60, late: 10, label: 'KW26' },
      { on: 85, late: 5, label: 'KW27' }, { on: 50, late: 20, label: 'KW28' },
      { on: 90, late: 8, label: 'KW29' }, { on: 65, late: 25, label: 'KW30' },
      { on: 95, late: 3, label: 'KW31' }, { on: 78, late: 12, label: 'KW32' }
    ];
    const weeks = raw.map(w => ({
      label: w.label,
      totalH: Math.round((w.on + w.late) / 100 * maxH) + 'px',
      onH: Math.round(w.on / (w.on + w.late) * 100) + '%',
      lateH: Math.round(w.late / (w.on + w.late) * 100) + '%'
    }));
    return { items, weeks };
  }
}
</script>
</body>
</html>
